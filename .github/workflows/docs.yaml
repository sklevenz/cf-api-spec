name: Build Docs and Publish to GitHub Pages

on:
    push:
        branches:
            - main

permissions:
  contents: write

jobs:
    publish:

        runs-on: ubuntu-latest

        env:
          GH_TOKEN: ${{ github.token }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: "20"

            - name: Install CLI tools
              run: |
                sudo apt-get update
                sudo apt-get install -y jq wget

                # Install GitHub CLI
                if ! command -v gh >/dev/null 2>&1; then
                  sudo apt-get install -y gh
                fi

                # Install yq (mikefarah)
                if ! command -v yq >/dev/null 2>&1; then
                  YQ_VERSION="v4.45.1"
                  sudo wget -q "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -O /usr/local/bin/yq
                  sudo chmod +x /usr/local/bin/yq
                fi

                gh --version
                jq --version
                yq --version
                wget --version

            - name: Generate OpenAPI Doc
              run: make upgrade docs

            - name: Push to gh-pages branch
              run: |
                git config --global user.name "github-actions"
                git config --global user.email "github-actions@github.com"
                git checkout --orphan gh-pages
                git add -f ./docs # Force add the docs folder to the gh-pages branch even if it's in .gitignore file 
                git commit -m "Publish GitHub Pages"
                git push origin gh-pages --force
