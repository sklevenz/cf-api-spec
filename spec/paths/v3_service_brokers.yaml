get:
  summary: List service brokers
  description: This endpoint retrieves the service brokers the user has access to.
  operationId: listServiceBrokers
  tags:
    - ServiceBrokers
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service broker names to filter by
    - name: space_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of space guids to filter by
    - $ref: ../components/parameters/LabelSelector.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceBrokerList.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '502':
      $ref: ../components/responses/502.yaml
    '503':
      $ref: ../components/responses/503.yaml
post:
  summary: Create a service broker
  description: >-
    This endpoint creates a new service broker and a job to synchronize the
    service offerings and service plans with those in the broker’s catalog. The
    `Location` header refers to the created job which syncs the broker with the
    catalog. See [_Service broker jobs_](#service-broker-jobs) for more
    information and limitations.
  operationId: createServiceBroker
  tags:
    - ServiceBrokers
  requestBody:
    $ref: ../components/requestBodies/ServiceBrokerCreate.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is creating the service broker
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
