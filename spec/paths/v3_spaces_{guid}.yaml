get:
  summary: Get a space
  description: This endpoint retrieves the specified space object.
  operationId: getSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - organization
      description: Optionally include additional related resources in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Space.yaml
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space
        quota:
          operationId: getSpaceQuota
          parameters:
            guid: $response.body#/relationships/quota/data/guid
          description: Retrieve the quota associated with this space
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
patch:
  summary: Update a space
  description: Update a space
  operationId: updateSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/SpaceUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Space.yaml
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space
        quota:
          operationId: getSpaceQuota
          parameters:
            guid: $response.body#/relationships/quota/data/guid
          description: Retrieve the quota associated with this space
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a space
  description: >-
    When a space is deleted, the user roles associated with the space will be
    deleted.
  operationId: deleteSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        location:
          description: URL of the job to query the asynchronous operation
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
