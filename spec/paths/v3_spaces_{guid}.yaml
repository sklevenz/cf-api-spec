get:
  summary: Get a space
  description: This endpoint retrieves the specified space object.
  operationId: getSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - organization
      description: Optionally include additional related resources in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Space.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2017-02-01T01:33:58Z'
                updated_at: '2017-02-01T01:33:58Z'
                name: my-space
                relationships:
                  organization:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  quota:
                    data: null
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920
                  features:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920/features
                  organization:
                    href: >-
                      https://api.example.org/v3/organizations/e00705b9-7b42-4561-ae97-2520399d2133
                  apply_manifest:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920/actions/apply_manifest
                    method: POST
                metadata:
                  labels: {}
                  annotations: {}
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space
        quota:
          operationId: getSpaceQuota
          parameters:
            guid: $response.body#/relationships/quota/data/guid
          description: Retrieve the quota associated with this space
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a space
  description: Update a space
  operationId: updateSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/SpaceUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Space.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2017-02-01T01:33:58Z'
                updated_at: '2017-02-01T01:33:58Z'
                name: my-space
                relationships:
                  organization:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  quota:
                    data: null
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920
                  features:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920/features
                  organization:
                    href: >-
                      https://api.example.org/v3/organizations/e00705b9-7b42-4561-ae97-2520399d2133
                  apply_manifest:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920/actions/apply_manifest
                    method: POST
                metadata:
                  labels: {}
                  annotations: {}
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space
        quota:
          operationId: getSpaceQuota
          parameters:
            guid: $response.body#/relationships/quota/data/guid
          description: Retrieve the quota associated with this space
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
delete:
  summary: Delete a space
  description: >-
    When a space is deleted, the user roles associated with the space will be
    deleted.
  operationId: deleteSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        location:
          description: URL of the job to query the asynchronous operation
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
