get:
  summary: List organizations for isolation segment
  description: >-
    Retrieve the organizations entitled to the isolation segment. Return only
    the organizations the user has access to.


    **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Auditor,
    Org Billing Manager, Org Manager
  operationId: listOrganizationsForIsolationSegmentShort
  tags:
    - Isolation Segments
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: >-
        Comma-delimited list of organization names to filter by
        (case-insensitive)
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of organization guids to filter by
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - name: order_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - name
          - -name
      description: >-
        Value to sort by; defaults to ascending. Prepend with `-` to sort
        descending. Valid values are `created_at`, `updated_at`, and `name`
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizationList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 2
                  total_pages: 1
