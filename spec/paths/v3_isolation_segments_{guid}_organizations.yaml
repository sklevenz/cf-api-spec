                  last:
                    href: >-
                      https://api.example.org/v3/isolation_segments/933b4c58-120b-499a-b85d-4b6fc9e2903b/organizations?page=1&per_page=50
                  next: null
                  previous: null
                resources:
                  - guid: 885735b5-aea4-4cf5-8e44-961af0e41920
