get:
  summary: Get a service broker
  description: This endpoint retrieves the service broker by GUID.
  operationId: getServiceBroker
  tags:
    - Service Brokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceBroker.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                name: my_service_broker
                url: https://example.service-broker.com
                created_at: '2015-11-13T17:02:56Z'
                updated_at: '2016-06-08T16:41:26Z'
                relationships:
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                metadata:
                  labels:
                    type: dev
                  annotations: {}
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/service_brokers/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  service_offerings:
                    href: >-
                      https://api.example.org/v3/service_offerings?service_broker_guids=dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  space:
                    href: >-
                      https://api.example.org/v3/spaces/2f35885d-0c9d-4423-83ad-fd05066f8576
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: >-
            Retrieve the space for this service broker (space-scoped brokers
            only)
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a service broker
  description: >-
    This endpoint updates a service broker. Depending on the parameters
    specified, the endpoint may respond with a background job, and it may
    synchronize the service offerings and service plans with those in the
    broker’s catalog.


    When a service broker has a synchronization job in progress, only updates
    with `metadata` are permitted until the synchronization job is complete.
  operationId: updateServiceBroker
  tags:
    - Service Brokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceBrokerUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceBroker.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                name: my_service_broker
                url: https://example.service-broker.com
                created_at: '2015-11-13T17:02:56Z'
                updated_at: '2016-06-08T16:41:26Z'
                relationships:
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                metadata:
                  labels:
                    type: dev
                  annotations: {}
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/service_brokers/dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  service_offerings:
                    href: >-
                      https://api.example.org/v3/service_offerings?service_broker_guids=dde5ad2a-d8f4-44dc-a56f-0452d744f1c3
                  space:
                    href: >-
                      https://api.example.org/v3/spaces/2f35885d-0c9d-4423-83ad-fd05066f8576
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: >-
            Retrieve the space for this service broker (space-scoped brokers
            only)
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is updating the service broker
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
delete:
  summary: Delete a service broker
  description: >-
    This endpoint creates a job to delete an existing service broker. The
    `Location` header refers to the created job. See [_Service broker
    jobs_](#service-broker-jobs) for more information and limitations.
  operationId: deleteServiceBroker
  tags:
    - Service Brokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the service broker
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
