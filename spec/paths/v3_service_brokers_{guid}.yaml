get:
  summary: Get a service broker
  description: This endpoint retrieves the service broker by GUID.
  operationId: getServiceBroker
  tags:
    - ServiceBrokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceBroker.yaml
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: >-
            Retrieve the space for this service broker (space-scoped brokers
            only)
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a service broker
  description: >-
    This endpoint updates a service broker. Depending on the parameters
    specified, the endpoint may respond with a background job, and it may
    synchronize the service offerings and service plans with those in the
    broker’s catalog.


    When a service broker has a synchronization job in progress, only updates
    with `metadata` are permitted until the synchronization job is complete.
  operationId: updateServiceBroker
  tags:
    - ServiceBrokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceBrokerUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceBroker.yaml
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: >-
            Retrieve the space for this service broker (space-scoped brokers
            only)
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is updating the service broker
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a service broker
  description: >-
    This endpoint creates a job to delete an existing service broker. The
    `Location` header refers to the created job. See [_Service broker
    jobs_](#service-broker-jobs) for more information and limitations.
  operationId: deleteServiceBroker
  tags:
    - ServiceBrokers
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the service broker
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
