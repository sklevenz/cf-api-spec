get:
  summary: Get a package
  description: Retrieve a package.
  operationId: getPackage
  tags:
    - Packages
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: Successfully retrieved package
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Package.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this package
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
patch:
  summary: Update a package
  description: Update a package.
  operationId: updatePackage
  tags:
    - Packages
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    description: Package object that needs to be updated
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            metadata:
              $ref: ../components/schemas/Metadata.yaml
            username:
              type: string
              description: >-
                The username for the image’s registry. Only possible for Docker
                package.
            password:
              type: string
              description: >-
                The password for the image’s registry. Only possible for Docker
                package.
        examples:
          default:
            summary: default
            value:
              metadata:
                labels:
                  key: value
                annotations:
                  note: detailed information
  responses:
    '200':
      description: Successfully updated package
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Package.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
delete:
  summary: Delete a package
  description: Delete a package.
  operationId: deletePackage
  tags:
    - Packages
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the package
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
