get:
  summary: Get SSH enabled for an app
  description: >-
    Returns if an application’s runtime environment will accept ssh connections.
    If ssh is disabled, the `reason` field will describe whether it is disabled
    globally, at the space level, or at the app level.
  operationId: getSshEnabledForApp
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AppSshEnabled.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
