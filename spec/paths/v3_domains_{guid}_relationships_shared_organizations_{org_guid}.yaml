delete:
  summary: Unshare a domain
  description: >-
    This endpoint removes an organization from the list of organizations an
    organization-scoped domain is shared with. This prevents the organization
    from using the organization-scoped domain.


    **Permitted roles:** Admin, Org Manager *(can be in either the domain's
    owning organization or the organization it has been shared to)*
  operationId: unshareDomain
  tags:
    - Domains
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: org_guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The guid of the organization to unshare the domain from
  responses:
    '204':
      description: Successfully unshared domain
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
