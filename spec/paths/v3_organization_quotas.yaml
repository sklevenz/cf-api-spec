post:
  summary: Create an organization quota
  description: >-
    This endpoint creates a new organization quota, but does not assign it to a
    specific organization unless an organization GUID is provided in the
    `relationships.organizations` parameter.


    To create an organization quota you must be an admin.
  operationId: createOrganizationQuota
  tags:
    - Organization Quotas
  requestBody:
    $ref: ../components/requestBodies/OrganizationQuotaCreateRequestBody.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizationQuota.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2016-05-04T17:00:41Z'
                updated_at: '2016-05-04T17:00:41Z'
