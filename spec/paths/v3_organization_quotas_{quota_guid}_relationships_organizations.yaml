post:
  summary: Apply an organization quota to an organization
  description: |-
    This endpoint applies an organization quota to one or more organizations.

    Only admin users can apply an organization quota to an organization.
  operationId: applyOrganizationQuota
  tags:
    - OrganizationQuotas
  parameters:
    - name: quota_guid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: quota_guid identifier
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToMany.yaml
    description: Apply the organization quota to the given organizations.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
