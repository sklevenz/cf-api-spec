get:
  summary: List packages for an app
  description: Retrieve packages for an app that the user has access to.
  operationId: listAppPackages
  tags:
    - Packages
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of app GUIDs to filter by
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - name: states
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - AWAITING_UPLOAD
            - PROCESSING_UPLOAD
            - READY
            - FAILED
            - COPYING
            - EXPIRED
      description: Comma-delimited list of package states to filter by
    - name: types
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - bits
            - docker
      description: Comma-delimited list of package types to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PackageList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 1
                  total_pages: 1
                  first:
                    href: >-
                      https://api.example.org/v3/apps/f2efe391-2b5b-4836-8518-ad93fa9ebf69/packages?states=READY&page=1&per_page=50
                  last:
                    href: >-
                      https://api.example.org/v3/apps/f2efe391-2b5b-4836-8518-ad93fa9ebf69/packages?states=READY&page=1&per_page=50
                  next: null
                  previous: null
                resources:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                    type: bits
                    data:
                      error: null
                      checksum:
                        type: sha256
                        value: null
                    state: READY
                    created_at: '2016-03-17T21:41:09Z'
                    updated_at: '2016-06-08T16:41:26Z'
                    relationships:
                      app:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    links:
                      self:
                        href: >-
                          https://api.example.org/v3/packages/752edab0-2147-4f58-9c25-cd72ad8c3561
                      upload:
                        href: >-
                          https://api.example.org/v3/packages/752edab0-2147-4f58-9c25-cd72ad8c3561/upload
                        method: POST
                      download:
                        href: >-
                          https://api.example.org/v3/packages/752edab0-2147-4f58-9c25-cd72ad8c3561/download
                        method: GET
                      app:
                        href: >-
                          https://api.example.org/v3/apps/f2efe391-2b5b-4836-8518-ad93fa9ebf69
                    metadata:
                      labels: {}
                      annotations: {}
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
