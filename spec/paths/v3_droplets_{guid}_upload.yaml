post:
  summary: Upload droplet bits
  description: >-
    Upload a gzip compressed tarball file containing a Cloud Foundry compatible
    droplet. The file must be sent as part of a multi-part form.
  operationId: uploadDroplet
  tags:
    - Droplets
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    description: The droplet file to be uploaded
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            bits:
              type: string
              format: binary
            resources:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size_in_bytes:
                    type: integer
                  checksum:
                    type: object
                    properties:
                      value:
                        type: string
      application/json:
        schema:
          type: object
          properties:
            resources:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  size_in_bytes:
                    type: integer
                  checksum:
                    type: object
                    properties:
                      value:
                        type: string
  responses:
    '200':
      $ref: ../components/responses/DropletGetResponse.yaml
    '202':
      description: Upload initiated
      headers:
        Location:
          schema:
            type: string
          description: URL of the job tracking the upload
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Droplet.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
