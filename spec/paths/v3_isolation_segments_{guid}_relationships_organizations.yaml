post:
  summary: Entitle organizations for an isolation segment
  description: >-
    This endpoint entitles the specified organizations for the isolation
    segment. In the case where the specified isolation segment is the
    system-wide shared segment, and if an organization is not already entitled
    for any other isolation segment, then the shared isolation segment
    automatically gets assigned as the default for that organization.


    **Permitted roles:** Admin
  operationId: entitleOrganizationsForIsolationSegment
  tags:
    - Isolation Segments
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    description: >-
      Organization relationships; each organization will be entitled to manage
      this isolation segment
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToMany.yaml
          description: >-
            Organization relationships; each organization will be entitled to
            manage this isolation segment
          type: object
        examples:
          default:
            summary: default
            value:
              data:
                - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                  - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/isolation_segments/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/organizations
                  related:
                    href: >-
                      https://api.example.org/v3/isolation_segments/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/organizations
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
get:
  summary: List organizations relationship
  description: >-
    This endpoint lists the organizations entitled for the isolation segment.
    For an Admin, this will list all entitled organizations in the system. For
    any other user, this will list only the entitled organizations to which the
    user belongs.


    **Permitted roles:** All Roles
  operationId: listOrganizationsForIsolationSegment
  tags:
    - Isolation Segments
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 68d54d31-9b3a-463b-ba94-e8e4c32edbac
                  - guid: b19f6525-cbd3-4155-b156-dc0c2a431b4c
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/isolation_segments/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/organizations
                  related:
                    href: >-
                      https://api.example.org/v3/isolation_segments/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/organizations
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
