get:
  summary: Get a user
  description: Retrieve a user.
  operationId: getUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/UserGuid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/User.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a user
  description: Update a user's metadata.
  operationId: updateUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/UserGuid.yaml
  requestBody:
    $ref: ../components/requestBodies/UserUpdate.yaml
  responses:
    '200':
      $ref: ../components/responses/UserUpdateResponse.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
delete:
  summary: Delete a user
  description: All roles associated with a user will be deleted if the user is deleted.
  operationId: deleteUser
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/UserGuid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the user
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
