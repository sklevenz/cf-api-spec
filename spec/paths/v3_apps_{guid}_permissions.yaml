get:
  summary: Get permissions for an app
  description: >-
    Get the current user’s permissions for the given app. If a user can see an
    app, then they can see its basic data. Only admin, read-only admins, and
    space developers can read sensitive data.
  operationId: getPermissionsForApp
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AppPermissions.yaml
          examples:
            default:
              summary: default
              value:
                read_basic_data: true
                read_sensitive_data: false
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
