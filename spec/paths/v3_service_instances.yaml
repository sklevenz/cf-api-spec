post:
  summary: Create a service instance
  description: >-
    This endpoint creates a new service instance. Service instances can be of
    type `managed` or `user-provided`, and the required parameters are different
    for each type. User provided service instances do not require interactions
    with service brokers.


    If failures occur when creating managed service instances, the API might
    execute orphan mitigation steps accordingly to cases outlined in the [OSBAPI
    specification](https://github.com/openservicebrokerapi/servicebroker/blob/master/spec.md#orphan-mitigation)
  operationId: createServiceInstance
  tags:
    - Service Instances
  requestBody:
    $ref: ../components/requestBodies/ServiceInstanceCreateRequestBody.yaml
  responses:
    '201':
      description: User Provided Service instance created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserProvidedServiceInstance.yaml
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: Retrieve the space for this service instance
    '202':
      description: Service instance creation in progress
      headers:
        Location:
          description: URL of the job that is creating the service instance
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
