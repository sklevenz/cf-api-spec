get:
  summary: Get credentials for a user-provided service instance
  description: >-
    Retrieves the credentials for a user-provided service instance. This
    endpoint is not available for managed service instances.
  operationId: getServiceInstanceCredentials
  tags:
    - Service Instances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
          examples:
            default:
              summary: default
              value:
                username: my-username
                password: super-secret
                other: credential
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
