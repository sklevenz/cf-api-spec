                        method: POST
                      download:
                        href: >-
                          https://api.example.org/v3/packages/a57fd932-85db-483a-a27e-b00efbb3b0a4/download
                        method: GET
                      app:
                        href: >-
                          https://api.example.org/v3/apps/fa3558ce-1c4d-46fc-9776-54b9c8021745
                    metadata:
                      labels: {}
