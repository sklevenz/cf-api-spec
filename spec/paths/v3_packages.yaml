post:
  summary: Create a package
  description: Create a package.
  operationId: createPackage
  tags:
    - Packages
  requestBody:
    $ref: ../components/requestBodies/PackageCreateRequestBody.yaml
  responses:
    '201':
      description: Successfully created package
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Package.yaml
          examples:
            docker_app:
              summary: Docker app
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                type: docker
                data:
                  image: registry/image:latest
                  username: username
                  password: '***'
                state: READY
                created_at: '2015-11-03T00:53:54Z'
                updated_at: '2016-06-08T16:41:26Z'
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/packages/4cb65058-f04f-458f-aca1-5f4e43de6407
                  app:
                    href: >-
                      https://api.example.org/v3/apps/d8b8148d-5798-44de-821a-64b85b15e968
                metadata:
                  labels: {}
                  annotations: {}
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this package
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
