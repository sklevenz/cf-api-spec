get:
  summary: List packages
  description: Retrieve all packages.
  operationId: listPackages
  tags:
    - Packages
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of package guids to filter by
    - name: states
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - AWAITING_UPLOAD
            - PROCESSING_UPLOAD
            - READY
            - FAILED
            - COPYING
            - EXPIRED
      description: Comma-delimited list of package states to filter by
    - name: types
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - bits
            - docker
      description: Comma-delimited list of package types to filter by
    - name: app_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of app guids to filter by
    - name: space_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of space guids to filter by
    - name: organization_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of organization guids to filter by
  responses:
    '200':
      description: List of packages
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PackageList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 2
                  total_pages: 1
                  first:
                    href: >-
                      https://api.example.org?types=bits%2Cdocker&page=1&per_page=2
                  last:
                    href: >-
                      https://api.example.org?types=bits%2Cdocker&page=1&per_page=2
                  next: null
                  previous: null
                resources:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                    type: bits
                    data:
                      checksum:
                        type: sha256
                        value: null
                      error: null
                    state: AWAITING_UPLOAD
                    created_at: '2015-11-03T00:53:54Z'
                    updated_at: '2016-06-08T16:41:26Z'
                    relationships:
                      app:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    links:
                      self:
                        href: >-
                          https://api.example.org/v3/packages/a57fd932-85db-483a-a27e-b00efbb3b0a4
                      upload:
                        href: >-
