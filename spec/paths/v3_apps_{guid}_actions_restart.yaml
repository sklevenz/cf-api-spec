post:
  summary: Restart an app
  description: >-
    This endpoint will synchronously stop and start an application. Unlike the
    start and stop actions, this endpoint will error if the app is not
    successfully stopped in the runtime. For restarting applications without
    downtime, see the deployments resource.
  operationId: restartApp
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: Successfully restarted app
      content:
        application/json:
          schema:
            $ref: ../components/schemas/App.yaml
