get:
  summary: Get a service route binding
  description: This endpoint retrieves the service route binding by GUID.
  operationId: getServiceRouteBinding
  tags:
    - ServiceRouteBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - route
            - service_instance
      description: Optionally include a list of unique related resources in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceRouteBinding.yaml
      links:
        route:
          operationId: getRoute
          parameters:
            guid: $response.body#/relationships/route/data/guid
          description: Retrieve the route for this service route binding
        service_instance:
          operationId: getServiceInstance
          parameters:
            guid: $response.body#/relationships/service_instance/data/guid
          description: Retrieve the service instance for this service route binding
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a service route binding
  description: This endpoint updates a service route binding with labels and annotations.
  operationId: updateServiceRouteBinding
  tags:
    - ServiceRouteBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          properties:
            metadata:
              $ref: ../components/schemas/Metadata.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceRouteBinding.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a service route binding
  description: >-
    This endpoint deletes a service route binding. When deleting route bindings
    originating from user provided service instances, the delete operation does
    not require interactions with service brokers, therefore the API will
    respond synchronously to the delete request. Consequently, deleting route
    bindings from managed service instances responds with a job which can be
    used to track the progress of the delete operation.
  operationId: deleteServiceRouteBinding
  tags:
    - ServiceRouteBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the service route binding
          schema:
            type: string
            format: uri
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
