get:
  summary: Check reserved routes for a domain
  description: >-
    Check if a specific route for a domain exists, regardless of the user's
    visibility for the route in case the route belongs to a space the user does
    not belong to.


    **Permitted roles:** Admin, Admin Read-Only, Global Auditor, Org Auditor,
    Org Billing Manager *(can only check if routes exist for a domain without an
    organization relationship)*, Org Manager, Space Auditor, Space Developer,
    Space Manager, Space Supporter
  operationId: checkReservedRoutesForDomain
  tags:
    - Domains
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: host
      in: query
      required: false
      schema:
        type: string
      description: >-
        Hostname to filter by; defaults to empty string if not provided and only
        applicable to `http` routes
    - name: path
      in: query
      required: false
      schema:
        type: string
      description: >-
        Path to filter by; defaults to empty string if not provided and only
        applicable to `http` routes
    - name: port
      in: query
      required: false
      schema:
        type: integer
      description: >-
        Port to filter by; only applicable to `tcp` routes and required for
        `tcp` routes
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              matching_route:
                type: boolean
                description: >-
                  Whether a route matching the given host, path, and port exists
                  for the domain
          examples:
            default:
              summary: default
              value:
                matching_route: true
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
