get:
  summary: Get default isolation segment
  description: Retrieve the default isolation segment for a given organization.
  operationId: getDefaultIsolationSegmentForOrganization
  tags:
    - Organizations
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToOne.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Assign default isolation segment
  description: >-
    Set the default isolation segment for a given organization. Only isolation
    segments that are entitled to the organization are eligible to be the
    default isolation segment.


    Apps will not run in the new default isolation segment until they are
    restarted.
  operationId: assignDefaultIsolationSegmentForOrganization
  tags:
    - Organizations
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToOne.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToOne.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
