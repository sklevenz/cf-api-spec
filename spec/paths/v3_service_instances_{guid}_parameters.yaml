get:
  summary: Get parameters for a managed service instance
  description: >-
    Queries the Service Broker for the parameters associated with this service
    instance. The broker catalog must have enabled the `instances_retrievable`
    feature for the Service Offering. Check the [Service Offering
    object](#the-service-offering-object) for the value of this feature flag.
  operationId: getServiceInstanceParameters
  tags:
    - Service Instances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
          examples:
            default:
              summary: default
              value:
                key_1: value_1
                key_2: value_2
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
