get:
  summary: List users
  description: Retrieve all users that the current user can see.
  operationId: listUsers
  tags:
    - Users
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of user guids to filter by
    - name: usernames
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of usernames to filter by
    - name: origins
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of user origins to filter by
    - name: partial_usernames
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of partial usernames to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserList.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '502':
      $ref: ../components/responses/502.yaml
    '503':
      $ref: ../components/responses/503.yaml
post:
  summary: Create a user
  description: >-
    Creating a user requires one value, a GUID. This creates a user in the Cloud
    Controller database.


    Generally, the GUID should match the GUID of an already-created user in the
    UAA database, though this is not required. Creating a user by guid is only
    permitted by admins.


    If CAPI property `cc.allow_user_creation_by_org_manager` is enabled, a UAA
    user will be automatically created if it does not exist yet. The UAA user
    will be only created when `username` and `origin` have been provided instead
    of a guid. Additionally `origin` must be different from `uaa`. Admins and
    OrgManagers can make use of the UAA user creation.
  operationId: createUser
  tags:
    - Users
  requestBody:
    $ref: ../components/requestBodies/UserCreate.yaml
  responses:
    '201':
      $ref: ../components/responses/UserCreateResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
