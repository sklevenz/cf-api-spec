post:
  summary: Create a space quota
  description: This endpoint creates a new space quota scoped to a specific organization.
  operationId: createSpaceQuota
  tags:
    - Space Quotas
  requestBody:
    $ref: ../components/requestBodies/SpaceQuotaCreate.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceQuota.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2016-05-04T17:00:41Z'
                updated_at: '2016-05-04T17:00:41Z'
                name: don-quixote
                apps:
                  total_memory_in_mb: 5120
                  per_process_memory_in_mb: 1024
                  log_rate_limit_in_bytes_per_second: 1024
                  total_instances: 10
                  per_app_tasks: null
                services:
                  paid_services_allowed: true
                  total_service_instances: 10
                  total_service_keys: 20
                routes:
                  total_routes: 8
                  total_reserved_ports: 20
                relationships:
                  organization:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  spaces:
                    data:
                      - guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/space_quotas/f919ef8a-e333-472a-8172-baaf2c30d301
                  organization:
                    href: >-
                      https://api.example.org/v3/organizations/9b370018-c38e-44c9-86d6-155c76801104
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space quota
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
