get:
  summary: Get a build
  description: Retrieve a build.
  operationId: getBuild
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: Successfully retrieved build
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Build.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this build
        droplet:
          operationId: getDroplet
          parameters:
            guid: $response.body#/droplet/guid
          description: Retrieve the droplet for this build
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a build
  description: Update a build.
  operationId: updateBuild
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BuildUpdate.yaml
        examples:
          default:
            summary: default
            value:
              metadata:
                labels:
                  key: value
                annotations:
                  note: detailed information
    description: Request body for update a build.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Build.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
