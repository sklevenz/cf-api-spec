get:
  summary: Get a build
  description: Retrieve a build.
  operationId: getBuild
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: Successfully retrieved build
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Build.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this build
        droplet:
          operationId: getDroplet
          parameters:
            guid: $response.body#/droplet/data/guid
          description: Retrieve the droplet for this build
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a build
  description: Update a build.
  operationId: updateBuild
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/BuildUpdate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Build.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
