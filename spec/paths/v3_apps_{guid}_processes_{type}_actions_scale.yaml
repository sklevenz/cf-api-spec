post:
  summary: Scale a process for an app
  description: Scale a specific process for an app.
  operationId: scaleProcessForApp
  tags:
    - Processes
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: type
      in: path
      required: true
      schema:
        type: string
      description: The process type, for example web or worker.
  requestBody:
    content:
      application/json:
        schema:
          properties:
            instances:
              type:
                - integer
                - 'null'
                - string
            memory_in_mb:
              type:
                - integer
                - 'null'
                - string
            disk_in_mb:
              type:
                - integer
                - 'null'
            log_rate_limit_in_bytes_per_second:
              type:
                - integer
                - 'null'
    description: >-
      Scale an app process of the given type by updating instance count and or
      resource limits.
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Process.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
