get:
  summary: Get a sidecar
  description: Get a sidecar.
  operationId: getSidecar
  tags:
    - Sidecars
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Sidecar.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this sidecar
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '502':
      $ref: ../components/responses/BadGateway.yaml
    '503':
      $ref: ../components/responses/503.yaml
