get:
  summary: Get a service plan
  description: This endpoint retrieves the service plan by GUID.
  operationId: getServicePlan
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - space.organization
            - service_offering
      description: Optionally include a list of unique related resources in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServicePlan.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                name: my_big_service_plan
                description: Big
                visibility_type: public
                available: true
                free: false
                costs:
                  - currency: USD
                    amount: 199.99
                    unit: Monthly
                created_at: '2019-11-28T13:44:02Z'
                updated_at: '2019-11-28T13:44:02Z'
                maintenance_info:
                  version: 1.0.0+dev4
                  description: Database version 7.8.0
                broker_catalog:
                  id: db730a8c-11e5-11ea-838a-0f4fff3b1cfb
                  metadata:
                    custom-key: custom-information
                  maximum_polling_duration: null
                  features:
                    plan_updateable: true
                    bindable: true
                schemas:
                  service_instance:
                    create:
                      parameters:
                        $schema: http://json-schema.org/draft-04/schema#
                        type: object
                        properties:
                          billing-account:
                            description: >-
                              Billing account number used to charge use of
                              shared fake server.
                            type: string
                    update:
                      parameters: {}
                  service_binding:
                    create:
                      parameters: {}
                relationships:
                  service_offering:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                metadata:
                  labels: {}
                  annotations: {}
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/service_plans/bf7eb420-11e5-11ea-b7db-4b5d5e7976a9
                  service_offering:
                    href: >-
                      https://api.example.org/v3/service_offerings/13c60e38-11e7-11ea-9106-33ee3c5bd4d7
                  visibility:
                    href: >-
                      https://api.example.org/v3/service_plans/bf7eb420-11e5-11ea-b7db-4b5d5e7976a9/visibility
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a service plan
  description: This endpoint updates a service plan with labels and annotations.
  operationId: updateServicePlan
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          properties:
            metadata:
              $ref: ../components/schemas/Metadata.yaml
          type: object
    description: Request body for update a service plan.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServicePlan.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
delete:
  summary: Delete a service plan
  description: >-
    This endpoint deletes a service plan. This is used to remove service plans
    from the Cloud Foundry database when they

    are no longer provided by the service broker.
  operationId: deleteServicePlan
  tags:
    - Service Plans
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
