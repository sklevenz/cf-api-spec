get:
  summary: List tasks for an app
  description: Retrieve tasks for an app.
  operationId: listAppTasks
  tags:
    - Tasks
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of task guids to filter by
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of task names to filter by
    - name: states
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - PENDING
            - RUNNING
            - SUCCEEDED
            - CANCELING
            - FAILED
      description: Comma-delimited list of task states to filter by
    - name: sequence_ids
      in: query
      schema:
        type: array
        items:
          type: integer
      description: Comma-delimited list of sequence ids to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TaskList.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
post:
  summary: Create a task
  description: Create a task.
  operationId: createTask
  tags:
    - Tasks
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/TaskCreateRequestBody.yaml
  responses:
    '202':
      description: Accepted
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this task
        droplet:
          operationId: getDroplet
          parameters:
            guid: $response.body#/droplet_guid
          description: Retrieve the droplet for this task
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
