delete:
  summary: Terminate a process instance
  description: >-
    Terminate an instance of a specific process. Health management will
    eventually restart the instance.


    This allows a user to stop a single misbehaving instance of a process.
  operationId: terminateProcessInstance
  tags:
    - Processes
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: index
      in: path
      required: true
      schema:
        type: integer
      description: Zero-based index of the process instance.
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
    '500':
      $ref: ../components/responses/500.yaml
