delete:
  summary: Terminate a process instance
  description: >-
    Terminate an instance of a specific process. Health management will
    eventually restart the instance.


    This allows a user to stop a single misbehaving instance of a process.
  operationId: terminateProcessInstance
  tags:
    - Processes
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: index
      in: path
      required: true
      schema:
        type: integer
      description: index identifier
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
