get:
  summary: Get a service instance
  description: This endpoint retrieves the service instance by GUID.
  operationId: getServiceInstance
  tags:
    - ServiceInstances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: fields
      in: query
      schema:
        type: object
      description: Fields to include in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Discriminator for the service instance schema
            oneOf:
              - $ref: ../components/schemas/ManagedServiceInstance.yaml
              - $ref: ../components/schemas/UserProvidedServiceInstance.yaml
            discriminator:
              propertyName: type
              mapping:
                managed: ../components/schemas/ManagedServiceInstance.yaml
                user-provided: ../components/schemas/UserProvidedServiceInstance.yaml
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: Retrieve the space for this service instance
        service_plan:
          operationId: getServicePlan
          parameters:
            guid: $response.body#/relationships/service_plan/data/guid
          description: >-
            Retrieve the service plan for this service instance (managed
            instances only)
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
patch:
  summary: Update a service instance
  description: >-
    Some updates can be performed entirely within the Cloud Controller in which
    case the response is synchronous. Some updates require communication with
    the service broker, in which case the response will be asynchronous. The
    response will be asynchronous if any of these parameters are specified:

    * `parameters`

    * `service_plan`

    * `maintenance_info`

    * `name` - when the service offering has `allow_context_updates` feature
    enabled


    Otherwise the response will be synchronous.
  operationId: updateServiceInstance
  tags:
    - ServiceInstances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceInstanceUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Discriminator for the service instance schema
            oneOf:
              - $ref: ../components/schemas/ManagedServiceInstance.yaml
              - $ref: ../components/schemas/UserProvidedServiceInstance.yaml
            discriminator:
              propertyName: type
              mapping:
                managed: ../components/schemas/ManagedServiceInstance.yaml
                user-provided: ../components/schemas/UserProvidedServiceInstance.yaml
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: Retrieve the space for this service instance
        service_plan:
          operationId: getServicePlan
          parameters:
            guid: $response.body#/relationships/service_plan/data/guid
          description: >-
            Retrieve the service plan for this service instance (managed
            instances only)
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is updating the service instance
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a service instance
  description: >-
    This endpoint deletes a service instance and any associated service
    credential

    bindings or service route bindings. The service instance is removed from all

    spaces where it is available. User provided service instances do not require
    interactions with service brokers,

    therefore the API will respond synchronously to the delete request. For
    managed service instances, the API will respond asynchronously.

    If a service credential binding or service route binding cannot be deleted

    synchronously, then the operation will fail, and the deletion of the binding

    will continue in the background. The operation can be retried until it is
    successful.
  operationId: deleteServiceInstance
  tags:
    - ServiceInstances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: purge
      in: query
      schema:
        type: boolean
      description: >-
        If `true`, deletes the service instance and all associated resources
        without any interaction with the service broker.
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the service instance
          schema:
            type: string
            format: uri
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
