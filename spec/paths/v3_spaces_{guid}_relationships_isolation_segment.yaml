patch:
  summary: Manage isolation segment
  description: >-
    This endpoint assigns an isolation segment to the space. The isolation
    segment must be [entitled](#entitle-organizations-for-an-isolation-segment)
    to the space’s parent organization.


    Apps will not run in the newly assigned isolation segment until they are
    restarted.
  operationId: manageIsolationSegmentForSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToOne.yaml
        examples:
          default:
            summary: default
            value:
              data:
                guid: 123e4567-e89b-12d3-a456-426614174000
    description: Request body for manage isolation segment.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToOne.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/spaces/885735b5-aea4-4cf5-8e44-961af0e41920/relationships/isolation_segment
                  related:
                    href: >-
                      https://api.example.org/v3/isolation_segments/e4c91047-3b29-4fda-b7f9-04033e5a9c9f
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
