post:
  summary: Create a domain
  description: >-
    Create a domain.


    **Permitted roles:** Admin, Org Manager *(when an `organization`
    relationship is provided)*
  operationId: createDomain
  tags:
    - Domains
  requestBody:
    $ref: ../components/requestBodies/DomainCreateRequestBody.yaml
  responses:
    '201':
      description: Successfully created domain
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Domain.yaml
          examples:
            default:
              summary: default
              value:
                guid: 3a5d3d89-3f89-4f05-8188-8a2b298c79d5
                created_at: '2019-03-08T01:06:19Z'
                updated_at: '2019-03-08T01:06:19Z'
                name: test-domain.com
                internal: false
                router_group: null
                supported_protocols:
                  - http
                metadata:
                  labels: {}
                  annotations: {}
                relationships:
                  organization:
                    data:
                      guid: 3a3f3d89-3f89-4f05-8188-751b298c79d5
                  shared_organizations:
                    data:
                      - guid: 404f3d89-3f89-4a72-8188-751b298d88d5
                      - guid: 416d3d89-3f89-4b67-a189-123b298d3592
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/domains/3a5d3d89-3f89-4f05-8188-8a2b298c79d5
                  organization:
                    href: >-
                      https://api.example.org/v3/organizations/3a3f3d89-3f89-4f05-8188-751b298c79d5
