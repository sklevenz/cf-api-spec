get:
  summary: Get a service credential binding
  description: This endpoint retrieves the service credential binding by GUID.
  operationId: getServiceCredentialBinding
  tags:
    - ServiceCredentialBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - app
            - service_instance
      description: Optionally include a list of unique related resources in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Discriminator for the credential binding schema
            oneOf:
              - $ref: ../components/schemas/AppCredentialBinding.yaml
              - $ref: ../components/schemas/KeyCredentialBinding.yaml
            discriminator:
              propertyName: type
              mapping:
                app: ../components/schemas/AppCredentialBinding.yaml
                key: ../components/schemas/KeyCredentialBinding.yaml
      links:
        app:
          operationId: getApp
          parameters:
            guid: $response.body#/relationships/app/data/guid
          description: Retrieve the app for this credential binding (app bindings only)
        service_instance:
          operationId: getServiceInstance
          parameters:
            guid: $response.body#/relationships/service_instance/data/guid
          description: Retrieve the service instance for this credential binding
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a service credential binding
  description: >-
    This endpoint updates a service credential binding with labels and
    annotations.
  operationId: updateServiceCredentialBinding
  tags:
    - ServiceCredentialBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/ServiceCredentialBindingUpdateRequestBody.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Discriminator for the credential binding schema
            oneOf:
              - $ref: ../components/schemas/AppCredentialBinding.yaml
              - $ref: ../components/schemas/KeyCredentialBinding.yaml
            discriminator:
              propertyName: type
              mapping:
                app: ../components/schemas/AppCredentialBinding.yaml
                key: ../components/schemas/KeyCredentialBinding.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a service credential binding
  description: >-
    This endpoint deletes a service credential binding. When deleting credential
    bindings originated from user provided service instances, the delete
    operation does not require interactions with service brokers, therefore the
    API will respond synchronously to the delete request.
  operationId: deleteServiceCredentialBinding
  tags:
    - ServiceCredentialBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the service credential binding
          schema:
            type: string
            format: uri
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
