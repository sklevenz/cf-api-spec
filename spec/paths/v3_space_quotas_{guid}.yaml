      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a space quota
  description: >-
    This endpoint will only update the parameters specified in the request body.
    Any unspecified parameters will retain their existing values.
  operationId: updateSpaceQuota
  tags:
    - Space Quotas
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/SpaceQuotaUpdate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceQuota.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2016-05-04T17:00:41Z'
