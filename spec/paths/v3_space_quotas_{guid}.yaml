get:
  summary: Get a space quota
  description: Get a space quota
  operationId: getSpaceQuota
  tags:
    - SpaceQuotas
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceQuota.yaml
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space quota
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a space quota
  description: >-
    This endpoint will only update the parameters specified in the request body.
    Any unspecified parameters will retain their existing values.
  operationId: updateSpaceQuota
  tags:
    - SpaceQuotas
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    $ref: ../components/requestBodies/SpaceQuotaUpdate.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceQuota.yaml
      links:
        organization:
          operationId: getOrganization
          parameters:
            guid: $response.body#/relationships/organization/data/guid
          description: Retrieve the organization for this space quota
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
delete:
  summary: Delete a space quota
  description: Space quotas cannot be deleted when applied to any spaces.
  operationId: deleteSpaceQuota
  tags:
    - SpaceQuotas
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is deleting the space quota
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
