get:
  summary: List shared spaces relationship
  description: This endpoint lists the spaces that the service instance has been shared to.
  operationId: listServiceInstanceSharedSpaces
  tags:
    - Service Instances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: fields
      in: query
      schema:
        type: object
      description: Fields to include in the response
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
post:
  summary: Share a service instance to other spaces
  description: >-
    This endpoint shares the service instance with the specified spaces. In
    order to share into a space the requesting user must be a space developer in
    the target space.
  operationId: shareServiceInstance
  tags:
    - Service Instances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToMany.yaml
        examples:
          default:
            summary: default
            value:
              data:
                - guid: 123e4567-e89b-12d3-a456-426614174000
                - guid: 123e4567-e89b-12d3-a456-426614174000
    description: Request body for share a service instance to other spaces.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationshipToMany.yaml
          examples:
            default:
              summary: default
              value:
                data:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/service_instances/bdeg4371-cbd3-4155-b156-dc0c2a431b4c/relationships/shared_spaces
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
