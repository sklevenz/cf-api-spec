post:
  summary: Create an app
  description: Creates a new app.
  operationId: createApp
  tags:
    - Apps
  requestBody:
    $ref: ../components/requestBodies/AppCreateRequestBody.yaml
  responses:
    '201':
      description: Successfully created app
      content:
        application/json:
          schema:
            $ref: ../components/schemas/App.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                name: my_app
                state: STOPPED
                created_at: '2016-03-17T21:41:30Z'
                updated_at: '2016-06-08T16:41:26Z'
                lifecycle:
                  type: buildpack
                  data:
                    buildpacks:
                      - java_buildpack
                    stack: cflinuxfs4
                relationships:
                  space:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  current_droplet:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446
                  space:
                    href: >-
                      https://api.example.org/v3/spaces/2f35885d-0c9d-4423-83ad-fd05066f8576
                  processes:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/processes
                  packages:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/packages
                  environment_variables:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/environment_variables
                  current_droplet:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/droplets/current
                  droplets:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/droplets
                  tasks:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/tasks
                  start:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/actions/start
                    method: POST
                  stop:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/actions/stop
                    method: POST
                  revisions:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/revisions
                  deployed_revisions:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/revisions/deployed
                  features:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/features
                metadata:
                  labels: {}
                  annotations: {}
      links:
        space:
          operationId: getSpace
          parameters:
            guid: $response.body#/relationships/space/data/guid
          description: Retrieve the space for this app
        current_droplet:
          operationId: getDroplet
          parameters:
            guid: $response.body#/relationships/current_droplet/data/guid
          description: Retrieve the current droplet for this app
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '422':
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Errors.yaml
          examples:
            uniqueness_error:
              value:
                errors:
                  - code: 10016
                    title: CF-UniquenessError
                    detail: The given app name is already taken in the targeted space
            feature_disabled:
              value:
                errors:
                  - code: 330002
                    title: CF-FeatureDisabled
                    detail: >-
                      Some feature flag must be enabled by the Cloud Foundry
                      admin in order to push the app as is.
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/ServiceUnavailable.yaml
