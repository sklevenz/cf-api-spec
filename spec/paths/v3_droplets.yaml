get:
  summary: List droplets
  description: Retrieve all droplets.
  operationId: listDroplets
  tags:
    - Droplets
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: |
        Comma-delimited list of droplet GUIDs to filter by
    - name: states
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - AWAITING_UPLOAD
            - PROCESSING_UPLOAD
            - STAGED
            - COPYING
            - FAILED
            - EXPIRED
      description: |
        Comma-delimited list of droplet states to filter by
    - name: app_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: |
        Comma-delimited list of app GUIDs to filter by
    - name: current
      in: query
      schema:
        type: boolean
      description: |
        If true, only include the current droplet for each app
    - name: space_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: |
        Comma-delimited list of space GUIDs to filter by
    - name: organization_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: |
        Comma-delimited list of organization GUIDs to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DropletList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 2
                  total_pages: 1
                  first:
                    href: https://api.example.org?page=1&per_page=50
                  last:
