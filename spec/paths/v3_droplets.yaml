post:
  summary: Create a droplet
  description: >-
    This endpoint is only for creating a droplet without a package. To create a
    droplet based on a package, see [Create a build](#create-a-build).
  operationId: createDroplet
  tags:
    - Droplets
  requestBody:
    $ref: ../components/requestBodies/DropletCreateRequestBody.yaml
  responses:
    '201':
      description: Droplet created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Droplet.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                state: AWAITING_UPLOAD
                error: null
                lifecycle:
                  type: buildpack
                  data: {}
                execution_metadata: ''
                process_types:
                  rake: bundle exec rake
                  web: bundle exec rackup config.ru -p $PORT
                checksum:
                  type: sha256
                  value: >-
                    e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
                buildpacks:
                  - name: ruby_buildpack
                    detect_output: ruby 1.6.14
                    version: 1.1.1.
                    buildpack_name: ruby
                stack: cflinuxfs4
                image: null
                created_at: '2016-03-28T23:39:34Z'
                updated_at: '2016-03-28T23:39:47Z'
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                links:
