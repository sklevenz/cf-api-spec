get:
  summary: Get an app feature
  description: Get an app feature.
  operationId: getAppFeature
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
          - revisions
          - service-binding-k8s
          - file-based-vcap-services
      description: name identifier
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update an app feature
  description: Update an app feature.
  operationId: updateAppFeature
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
          - revisions
          - service-binding-k8s
          - file-based-vcap-services
      description: name identifier
  requestBody:
    content:
      application/json:
        schema:
          properties:
            enabled:
              type: boolean
    description: Update the named app feature, enabling or disabling it.
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
