get:
  summary: Get an app feature
  description: Get an app feature.
  operationId: getAppFeature
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
          - revisions
          - service-binding-k8s
          - file-based-vcap-services
      description: Name of the feature.
  responses:
    '200':
      description: OK
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update an app feature
  description: Update an app feature.
  operationId: updateAppFeature
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
          - revisions
          - service-binding-k8s
          - file-based-vcap-services
      description: Name of the feature.
  requestBody:
    content:
      application/json:
        schema:
          properties:
            enabled:
              type: boolean
          type: object
        examples:
          default:
            summary: default
            value:
              enabled: false
    description: Request body for update an app feature.
  responses:
    '200':
      description: OK
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
