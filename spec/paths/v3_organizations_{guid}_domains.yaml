get:
  summary: List domains for an organization
  description: >-
    Retrieve all domains available in an organization for the current user. This
    will return unscoped domains (those without an owning organization), domains
    that are scoped to the given organization (owned by the given organization),
    and domains that have been shared with the organization.


    To retrieve the default domain for an organization, use the [get default
    domain](#get-default-domain) endpoint.
  operationId: listDomainsForOrganization
  tags:
    - Domains
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of domain names to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DomainList.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
