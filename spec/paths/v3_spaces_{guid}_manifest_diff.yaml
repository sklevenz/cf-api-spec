post:
  summary: Create a manifest diff for a space (experimental)
  description: >-
    This endpoint returns a JSON representation of the difference between the
    provided manifest and the current state of a space.


    Currently, this endpoint can only diff [version 1](#the-manifest-schema)
    manifests.
  operationId: createManifestDiffForSpace
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    content:
      application/x-yaml:
        schema:
          type: string
  responses:
    '201':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is creating the manifest diff
          schema:
            type: string
            format: uri
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is creating the manifest diff
          schema:
            type: string
            format: uri
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
