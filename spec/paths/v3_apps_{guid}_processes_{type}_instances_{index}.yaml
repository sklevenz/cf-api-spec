delete:
  summary: Terminate a process instance for an app
  description: Terminate a specific process instance for an app.
  operationId: terminateProcessInstanceForApp
  tags:
    - Processes
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: type
      in: path
      required: true
      schema:
        type: string
      description: Process type, such as web or worker.
    - name: index
      in: path
      required: true
      schema:
        type: integer
      description: Zero-based index of the process instance.
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
