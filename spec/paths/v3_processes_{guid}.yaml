  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Process.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                type: web
                command: rackup
                user: vcap
                instances: 5
                memory_in_mb: 256
                disk_in_mb: 1024
                log_rate_limit_in_bytes_per_second: 1024
                health_check:
                  type: port
                  data:
                    timeout: null
                readiness_health_check:
                  type: process
                  data:
                    invocation_timeout: null
                process_instances:
                  - index: 0
                    state: RUNNING
                    since: 123456789
                  - index: 1
                    state: STARTING
                    since: 123
                  - index: 2
                    state: DOWN
                    since: 456
                relationships:
                  app:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                  revision:
                    data:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                metadata:
                  labels: {}
                  annotations: {}
                created_at: '2016-03-23T18:48:22Z'
                updated_at: '2016-03-23T18:48:42Z'
                version: e9df685c-0464-4aa7-b5f0-8ed843077c13
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82
                  scale:
                    href: >-
                      https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82/actions/scale
                    method: POST
                  app:
                    href: >-
                      https://api.example.org/v3/apps/ccc25a0f-c8f4-4b39-9f1b-de9f328d0ee5
                  space:
                    href: >-
                      https://api.example.org/v3/spaces/2f35885d-0c9d-4423-83ad-fd05066f8576
                  stats:
                    href: >-
                      https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82/stats
                  process_instances:
                    href: >-
                      https://api.example.org/v3/processes/6a901b7c-9417-4dc1-8189-d3234aa0ab82/process_instances
