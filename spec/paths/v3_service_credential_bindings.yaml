get:
  summary: List service credential bindings
  description: >-
    This endpoint retrieves the service credential bindings the user has access
    to.
  operationId: listServiceCredentialBindings
  tags:
    - ServiceCredentialBinding
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service credential binding names to filter by
    - name: service_instance_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service instance guids to filter by
    - name: app_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of app guids to filter by
    - name: type
      in: query
      schema:
        type: string
        enum:
          - app
          - key
      description: Type of credential binding to filter by. Valid values are 'app' or 'key'
    - name: service_instance_names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service instance names to filter by
    - name: app_names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of app names to filter by
    - name: service_plan_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service plan guids to filter by
    - name: service_plan_names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service plan names to filter by
    - name: service_offering_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service offering guids to filter by
    - name: service_offering_names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service offering names to filter by
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of service credential binding guids to filter by
    - name: include
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - app
            - service_instance
      description: >-
        Optionally include a list of unique related resources in the response.
        Valid values are: `app`, `service_instance`
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceCredentialBindingList.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '502':
      $ref: ../components/responses/502.yaml
    '503':
      $ref: ../components/responses/503.yaml
post:
  summary: Create a service credential binding
  description: >-
    This endpoint creates a new service credential binding. Service credential
    bindings can be of type `app` or `key`; `key` is only valid for managed
    service instances.


    If failures occur when creating a service credential binding for a managed
    service instances, the API might execute orphan mitigation steps accordingly
    to cases outlined in the [OSBAPI
    specification](https://github.com/openservicebrokerapi/servicebroker/blob/master/spec.md#orphan-mitigation)
  operationId: createServiceCredentialBinding
  tags:
    - ServiceCredentialBinding
  requestBody:
    $ref: ../components/requestBodies/ServiceCredentialBindingCreateRequestBody.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            type: object
            required:
              - type
            properties:
              type:
                type: string
                description: Discriminator for the credential binding schema
            oneOf:
              - $ref: ../components/schemas/AppCredentialBinding.yaml
              - $ref: ../components/schemas/KeyCredentialBinding.yaml
            discriminator:
              propertyName: type
              mapping:
                app: ../components/schemas/AppCredentialBinding.yaml
                key: ../components/schemas/KeyCredentialBinding.yaml
    '202':
      description: Accepted
      headers:
        Location:
          description: URL of the job that is creating the service credential binding
          schema:
            type: string
            format: uri
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
