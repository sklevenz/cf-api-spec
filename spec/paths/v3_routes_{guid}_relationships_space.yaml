patch:
  summary: Transfer ownership (experimental)
  description: >-
    Transfers a the ownership of a route to a another space. Users must have
    write access for both spaces to perform this action. The original owning
    space will still retain access to the route as a [shared
    space](#share-a-route-with-other-spaces-experimental). To completely remove
    a space from a route, users will have to use [unshare
    route](#unshare-a-route-that-was-shared-with-another-space-experimental).
  operationId: transferRouteOwnership
  tags:
    - Routes
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    description: The space to transfer ownership to
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RelationshipToOne.yaml
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
