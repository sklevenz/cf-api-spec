get:
  summary: List organizations
  description: Retrieve all organizations the user has access to.
  operationId: listOrganizations
  tags:
    - Organizations
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of organization names to filter by
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of organization guids to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrganizationList.yaml
          example:
            pagination:
              total_results: 1
              total_pages: 1
              first:
                href: http://127.0.0.1:4010/v3/organizations?page=1&per_page=50
                method: GET
              last:
                href: http://127.0.0.1:4010/v3/organizations?page=1&per_page=50
                method: GET
              next: null
              previous: null
            resources:
              - guid: ee6a7af7-650d-499b-8e32-58a52ffdb7bc
                created_at: '2026-02-01T10:00:00Z'
                updated_at: '2026-02-01T10:00:00Z'
                name: Org1
                suspended: false
                relationships:
                  quota:
                    data:
                      guid: 00000000-0000-0000-0000-000000000000
                metadata:
                  labels: {}
                  annotations: {}
                links:
                  self:
                    href: >-
                      http://127.0.0.1:4010/v3/organizations/ee6a7af7-650d-499b-8e32-58a52ffdb7bc
                    method: GET
                  domains:
                    href: >-
                      http://127.0.0.1:4010/v3/organizations/ee6a7af7-650d-499b-8e32-58a52ffdb7bc/domains
                    method: GET
                  quota:
                    href: >-
                      http://127.0.0.1:4010/v3/organization_quotas/00000000-0000-0000-0000-000000000000
                    method: GET
                  default_domain:
                    href: >-
                      http://127.0.0.1:4010/v3/organizations/ee6a7af7-650d-499b-8e32-58a52ffdb7bc/domains/default
                    method: GET
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '502':
      $ref: ../components/responses/502.yaml
    '503':
      $ref: ../components/responses/503.yaml
post:
  summary: Create an organization
  description: Create an organization.
  operationId: createOrganization
  tags:
    - Organizations
  requestBody:
    $ref: ../components/requestBodies/OrganizationCreateRequestBody.yaml
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Organization.yaml
      links:
        quota:
          operationId: getOrganizationQuota
          parameters:
            guid: $response.body#/relationships/quota/data/guid
          description: Retrieve the quota associated with this organization
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '409':
      $ref: ../components/responses/409.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
    '503':
      $ref: ../components/responses/503.yaml
