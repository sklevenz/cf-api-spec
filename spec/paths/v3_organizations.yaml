                      https://api.example.org/v3/organizations?page=1&per_page=50
                  last:
                    href: >-
                      https://api.example.org/v3/organizations?page=1&per_page=50
                  next: null
                  previous: null
                resources:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                    created_at: '2017-02-01T01:33:58Z'
                    updated_at: '2017-02-01T01:33:58Z'
                    name: org1
                    suspended: false
                    relationships:
                      quota:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
