get:
  summary: Get a security group
  description: Get a security group.
  operationId: getSecurityGroup
  tags:
    - Security Groups
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SecurityGroup.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                created_at: '2020-02-20T17:42:08Z'
                updated_at: '2020-02-20T17:42:08Z'
                name: my-group0
                globally_enabled:
                  running: true
                  staging: false
                rules:
                  - protocol: tcp
                    destination: 10.10.10.0/24
                    ports: 443,80,8080
                  - protocol: icmp
                    destination: 10.10.10.0/24
                    type: 8
                    code: 0
                    description: Allow ping requests to private services
                  - protocol: icmpv6
                    destination: ::/0
                    type: -1
                    code: -1
                    description: Allow all ICMPv6 traffic
                  - protocol: tcp
                    destination: 1.1.1.1,2.2.2.2/24,10.0.0.0-10.0.0.255
                    ports: 80,443,8080
                    description: >-
                      Only valid if
                      cc.security_groups.enable_comma_delimited_destinations is
                      true
                relationships:
                  staging_spaces:
                    data:
                      - guid: 123e4567-e89b-12d3-a456-426614174000
                      - guid: 123e4567-e89b-12d3-a456-426614174000
                  running_spaces:
                    data: []
                links:
                  self:
                    href: >-
                      https://api.example.org/v3/security_groups/b85a788e-671f-4549-814d-e34cdb2f539a
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
