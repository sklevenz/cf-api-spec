    content:
      application/json:
        schema:
          $ref: ../components/schemas/SecurityGroupUpdate.yaml
    description: Request body for update a security group.
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SecurityGroup.yaml
          examples:
