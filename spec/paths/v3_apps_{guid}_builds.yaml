get:
  summary: List builds for an app
  description: Retrieve all builds for an app.
  operationId: listAppBuilds
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
    - name: states
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
            - STAGING
            - STAGED
            - FAILED
      description: Comma-delimited list of build states to filter by
    - $ref: ../components/parameters/LabelSelector.yaml
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/BuildList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 1
                  total_pages: 1
                  first:
                    href: https://api.example.org?states=STAGING&page=1&per_page=2
                  last:
                    href: https://api.example.org?states=STAGING&page=1&per_page=2
                  next: null
                  previous: null
                resources:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                    created_at: '2016-03-28T23:39:34Z'
                    updated_at: '2016-06-08T16:41:26Z'
                    created_by:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                      name: bill
                      email: bill@example.com
                    state: STAGING
                    staging_memory_in_mb: 1024
                    staging_disk_in_mb: 1024
                    staging_log_rate_limit_bytes_per_second: 1024
                    error: null
                    lifecycle:
                      type: buildpack
                      data:
                        buildpacks:
                          - ruby_buildpack
                        stack: cflinuxfs4
                    package:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                    droplet: null
                    relationships:
                      app:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    metadata:
                      labels: {}
                      annotations: {}
                    links:
                      self:
                        href: >-
                          https://api.example.org/v3/builds/585bc3c1-3743-497d-88b0-403ad6b56d16
                      app:
                        href: >-
                          https://api.example.org/v3/apps/7b34f1cf-7e73-428a-bb5a-8a17a8058396
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
patch:
  summary: Update a build
  description: Update a build.
  operationId: updateBuildViaApp
  tags:
    - Builds
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  requestBody:
    description: Build object that needs to be updated
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            metadata:
              $ref: ../components/schemas/Metadata.yaml
          description: Request schema for updating a build
  responses:
    '200':
      description: Successfully updated build
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Build.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
    '422':
      $ref: ../components/responses/UnprocessableEntity.yaml
