get:
  summary: List isolation segments
  description: >-
    Retrieves all isolation segments to which the user has access. For admin,
    this is all the isolation segments in the system. For anyone else, this is
    the isolation segments in the allowed list for any organization to which the
    user belongs.


    **Permitted roles:** All Roles
  operationId: listIsolationSegments
  tags:
    - Isolation Segments
  parameters:
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - name: order_by
      in: query
      required: false
      schema:
        type: string
        enum:
          - created_at
          - -created_at
          - updated_at
          - -updated_at
          - name
          - -name
      description: >-
        Value to sort by; defaults to ascending. Prepend with `-` to sort
        descending. Valid values are `created_at`, `updated_at`, and `name`
    - $ref: ../components/parameters/CreatedAts.yaml
    - $ref: ../components/parameters/UpdatedAts.yaml
    - $ref: ../components/parameters/LabelSelector.yaml
    - name: guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of isolation segment guids to filter by
    - name: names
      in: query
      schema:
        type: array
        items:
          type: string
      description: >-
        Comma-delimited list of isolation segment names to filter by
        (case-insensitive)
    - name: organization_guids
      in: query
      schema:
        type: array
        items:
          type: string
      description: Comma-delimited list of organization guids to filter by
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/IsolationSegmentList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 11
                  total_pages: 3
                  first:
