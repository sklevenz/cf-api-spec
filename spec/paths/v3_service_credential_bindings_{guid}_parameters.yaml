get:
  summary: Get parameters for a service credential binding
  description: >-
    Queries the Service Broker for the parameters associated with this service
    credential binding. The broker catalog must have enabled the
    `bindings_retrievable` feature for the Service Offering. Check the [Service
    Offering object](#the-service-offering-object) for the value of this feature
    flag. This endpoint is not available for User-Provided Service Instances.
  operationId: getServiceCredentialBindingParameters
  tags:
    - ServiceCredentialBinding
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
