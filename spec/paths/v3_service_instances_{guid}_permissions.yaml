get:
  summary: Get permissions for a service instance
  description: >-
    Get the current user’s permissions for the given service instance. If a user
    can get a service instance then they can ‘read’ it. Users who can update a
    service instance can ‘manage’ it.


    This endpoint’s primary purpose is to enable third-party service dashboards
    to determine the permissions of a given Cloud Foundry user that has
    authenticated with the dashboard via single sign-on (SSO). For more
    information, see the Cloud Foundry documentation on [Dashboard Single
    Sign-On](https://docs.cloudfoundry.org/services/dashboard-sso.html).
  operationId: getServiceInstancePermissions
  tags:
    - ServiceInstances
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              read:
                type: boolean
              manage:
                type: boolean
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
