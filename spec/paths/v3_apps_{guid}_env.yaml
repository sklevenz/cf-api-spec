get:
  summary: Get environment for an app
  description: >-
    Retrieve the environment variables that will be provided to an app at
    runtime. It will include environment variables for Environment Variable
    Groups and Service Bindings.
  operationId: getEnvForApp
  tags:
    - Apps
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AppEnvironment.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
