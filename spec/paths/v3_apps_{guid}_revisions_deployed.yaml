get:
  summary: List deployed revisions for an app
  description: >-
    Retrieve deployed revisions for an app the user has access to. Deployed
    revisions are revisions that are linked to started processes in the app.
  operationId: listDeployedRevisionsForApp
  tags:
    - Revisions
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - $ref: ../components/parameters/Page.yaml
    - $ref: ../components/parameters/PerPage.yaml
    - $ref: ../components/parameters/OrderBy.yaml
  responses:
    '200':
      description: Successfully retrieved deployed revisions for app
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RevisionList.yaml
          examples:
            default:
              summary: default
              value:
                pagination:
                  total_results: 1
                  total_pages: 1
                  first:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/revisions?page=1&per_page=50
                  last:
                    href: >-
                      https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446/revisions?page=1&per_page=50
                  next: null
                  previous: null
                resources:
                  - guid: 123e4567-e89b-12d3-a456-426614174000
                    version: 1
                    droplet:
                      guid: 123e4567-e89b-12d3-a456-426614174000
                    processes:
                      web:
                        command: bundle exec rackup
                    sidecars:
                      - name: auth-sidecar
                        command: bundle exec sidecar
                        process_types:
                          - web
                        memory_in_mb: 300
                    description: Initial revision.
                    deployable: true
                    relationships:
                      app:
                        data:
                          guid: 123e4567-e89b-12d3-a456-426614174000
                    created_at: '2017-02-01T01:33:58Z'
                    updated_at: '2017-02-01T01:33:58Z'
                    metadata:
                      labels: {}
                      annotations: {}
                    links:
                      self:
                        href: >-
                          https://api.example.org/v3/revisions/885735b5-aea4-4cf5-8e44-961af0e41920
                      app:
                        href: >-
                          https://api.example.org/v3/apps/1cb006ee-fb05-47e1-b541-c34179ddc446
                      environment_variables:
                        href: >-
                          https://api.example.org/v3/revisions/885735b5-aea4-4cf5-8e44-961af0e41920/environment_variables
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      $ref: ../components/responses/Forbidden.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
