delete:
  summary: Unbind a staging security group from a space
  description: >-
    This endpoint removes a space from a security group with the staging
    lifecycle. Apps within this space must be restaged for these changes to take
    effect.
  operationId: unbindStagingSecurityGroup
  tags:
    - SecurityGroups
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - $ref: ../components/parameters/SpaceGuid.yaml
  responses:
    '204':
      description: No Content
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
