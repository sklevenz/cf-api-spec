  description: This endpoint retrieves the service offering by GUID.
  operationId: getServiceOffering
  tags:
    - Service Offerings
  parameters:
    - $ref: ../components/parameters/Guid.yaml
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ServiceOffering.yaml
          examples:
            default:
              summary: default
              value:
                guid: 123e4567-e89b-12d3-a456-426614174000
                name: my_service_offering
                description: Provides my service
                available: true
                tags:
                  - relational
                  - caching
                requires: []
