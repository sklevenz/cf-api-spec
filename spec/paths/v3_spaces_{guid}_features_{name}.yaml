get:
  summary: Get a space feature
  description: Get a space feature
  operationId: getSpaceFeature
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceFeature.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
patch:
  summary: Update a space feature
  description: Update a space feature.
  operationId: updateSpaceFeature
  tags:
    - Spaces
  parameters:
    - $ref: ../components/parameters/Guid.yaml
    - name: name
      in: path
      required: true
      schema:
        type: string
        enum:
          - ssh
  requestBody:
    content:
      application/json:
        schema:
          properties:
            enabled:
              type: boolean
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpaceFeature.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '422':
      $ref: ../components/responses/422.yaml
    '429':
      $ref: ../components/responses/429.yaml
    '500':
      $ref: ../components/responses/500.yaml
