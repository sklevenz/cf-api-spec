type: object
description: >-
  Shallow representation of a Space used inside IncludedResources to avoid
  circular references
allOf:
  - $ref: ./BaseSchema.yaml
  - type: object
    properties:
      name:
        type: string
        description: Name of the space
      relationships:
        type: object
        properties:
          organization:
            $ref: ./RelationshipToOne.yaml
        description: Relationships for the space
      links:
        type: object
        properties:
          self:
            $ref: ./Link.yaml
    required:
      - name
      - relationships
      - links
