type: object
properties:
  resources:
    type: array
    items:
      type: object
      properties:
        type:
          type: string
        index:
          type: integer
        state:
          type: string
          enum:
            - RUNNING
            - CRASHED
            - STARTING
            - DOWN
            - STOPPING
        host:
          type: string
        uptime:
          type: integer
        mem_quota:
          type:
            - integer
            - 'null'
        disk_quota:
          type:
            - integer
            - 'null'
        log_rate_limit:
          type:
            - integer
            - 'null'
        usage:
          type: object
          properties:
            time:
              type: string
              format: date-time
            cpu:
              type: number
            mem:
              type: integer
            disk:
              type: integer
            log_rate:
              type: integer
            cpu_entitlement:
              type: number
        instance_guid:
          type: string
        routable:
          type: boolean
        instance_internal_ip:
          type: string
        instance_ports:
          type:
            - array
            - 'null'
          items:
            type: object
            properties:
              external:
                type: integer
              internal:
                type: integer
              external_tls_proxy_port:
                type: integer
              internal_tls_proxy_port:
                type: integer
        fds_quota:
          type: integer
        isolation_segment:
          type:
            - string
            - 'null'
        details:
          type:
            - string
            - 'null'
description: Statistics for a process
