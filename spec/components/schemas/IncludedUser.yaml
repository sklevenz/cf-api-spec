type: object
description: >-
  Shallow representation of a User used inside IncludedResources to avoid
  circular references
allOf:
  - $ref: ./BaseSchema.yaml
  - type: object
    properties:
      username:
        type:
          - string
          - 'null'
        description: The username of the user
      presentation_name:
        type: string
        description: The presentation name of the user
      origin:
        type:
          - string
          - 'null'
        description: The origin of the user
      links:
        type: object
        properties:
          self:
            $ref: ./Link.yaml
