type: object
properties:
  pagination:
    $ref: ./Pagination.yaml
  resources:
    type: array
    items:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Discriminator for the credential binding schema
      oneOf:
        - $ref: ./AppCredentialBinding.yaml
        - $ref: ./KeyCredentialBinding.yaml
      discriminator:
        propertyName: type
        mapping:
          app: ./AppCredentialBinding.yaml
          key: ./KeyCredentialBinding.yaml
  included:
    $ref: ./IncludedResources.yaml
    description: >-
      Additional related resources included in the response when using the
      include parameter
