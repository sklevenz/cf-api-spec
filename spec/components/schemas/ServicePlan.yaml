            type: object
          visibility:
            $ref: ./Link.yaml
            description: The URL to get the visibility for this plan
            type: object
      included:
        $ref: ./IncludedResources.yaml
        description: >-
          Additional related resources included in the response when using the
          include parameter
        type: object
    type: object
