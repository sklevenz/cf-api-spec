  - properties:
      service_offering_guid:
        type: string
      service_offering_name:
        type: string
      metadata:
        $ref: ./Metadata.yaml
      links:
        type: object
        properties:
          self:
            $ref: ./Link.yaml
            description: The URL to get this service plan
            type: object
          service_offering:
            $ref: ./Link.yaml
