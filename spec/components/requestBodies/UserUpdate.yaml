description: User to update
content:
  application/json:
    schema:
      type: object
      properties:
        username:
          type: string
          description: The username of the user
        presentation_name:
          type: string
          description: The presentation name of the user
        origin:
          type: string
          description: The origin of the user
        metadata:
          $ref: ../schemas/Metadata.yaml
        links:
          type: object
          properties:
            self:
              $ref: ../schemas/Link.yaml
              description: The URL to get this user
              type: object
        rate_limits:
          type: object
          properties:
            custom_request_limit:
              type:
                - integer
                - 'null'
              description: Custom request limit for the user; null restores the default.
    examples:
      default:
        summary: default
        value:
          metadata:
            labels:
              environment: production
            annotations:
              note: detailed information
          rate_limits:
            custom_request_limit: 2000
