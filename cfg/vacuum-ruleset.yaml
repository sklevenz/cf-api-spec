# This Vacuum configuration defines the baseline linting behavior for the 
#  OpenAPI spec, relaxing stylistic rules that are intentional in Cloud Foundry 
# while enforcing strict correctness for references, descriptions, and structural 
# consistency.

extends: [[vacuum:oas, recommended]]

rules:

  # Rules are mostly turned off to avoid overcomplicating the spec or ensure compatibility
  owasp-array-limit: off
  owasp-constrained-additionalProperties: off
  owasp-integer-format: off
  owasp-integer-limit: off
  owasp-no-additionalProperties: off
  owasp-protection-global-safe: off
  owasp-rate-limit: off
  owasp-security-hosts-https-oas3: off
  owasp-string-limit: off
  owasp-string-restricted: off

  oas3-missing-example: off
  
  camel-case-properties: off
  component-description: off
  description-duplication: off
  no-$ref-siblings: off
  path-item-refs: off
  paths-kebab-case: off
