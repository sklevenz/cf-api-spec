openapi: 3.1.0
info:
  title: UAA mock
  version: 0.0.0
servers:
  - url: http://127.0.0.1:4010
paths:
  /info:
    get:
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                token_endpoint: http://127.0.0.1:4010/oauth/token
                authorization_endpoint: http://127.0.0.1:4010/oauth/authorize
  /oauth/token:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [password, refresh_token]
                username:
                  type: string
                password:
                  type: string
                refresh_token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              example:
                access_token: "eyJqa3UiOiJodHRwOi8vbG9jYWxob3N0OjQwMTAiLCJraWQiOiJrZXktMSIsInR5cCI6IkpXVCIsImFsZyI6IlJTMjU2In0..bW9jay1zaWduYXR1cmU"
                token_type: Bearer
                expires_in: 3600
                refresh_token: mock-refresh-token